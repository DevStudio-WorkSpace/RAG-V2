services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: sublitex_qdrant
    restart: unless-stopped
    # Seguridad: Qdrant sin puertos públicos (solo red interna)
    volumes:
      - ./qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: sublitex_api
    restart: unless-stopped
    # Seguridad: API detrás del reverse proxy, sin exponer 8000 directamente al exterior
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
      - ./qdrant_data:/app/qdrant_data
    environment:
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION_NAME=sublitex_fashion_v1
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - CATALOG_PATH=/app/data/images_normalized
    depends_on:
      - qdrant
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # URL de la API vista desde el navegador (relativa al proxy: /backend/*)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/backend}
    container_name: sublitex_frontend
    restart: unless-stopped
    # Seguridad: Frontend detrás del reverse proxy, sin exponer 3000 directamente al exterior
    expose:
      - "3000"
    volumes:
      - ./data/images_normalized:/data/images_normalized:ro
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  proxy:
    image: caddy:2-alpine
    container_name: sublitex_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./data/images_normalized:/srv/images_normalized:ro
    depends_on:
      - api
      - frontend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
