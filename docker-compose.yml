services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: sublitex_qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ./qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - "QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:?Defina QDRANT_API_KEY en .env}"
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: sublitex_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./qdrant_data:/app/qdrant_data
    environment:
      - QDRANT_URL=http://qdrant:6333
      - "QDRANT_API_KEY=${QDRANT_API_KEY:?Defina QDRANT_API_KEY en .env}"
      - QDRANT_COLLECTION_NAME=sublitex_fashion_v1
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - CATALOG_PATH=/app/data/images_normalized
      - "API_CLIENT_KEY=${API_CLIENT_KEY:?Defina API_CLIENT_KEY en .env}"
      - "API_CLIENT_KEYS=${API_CLIENT_KEYS:-}"
      - "API_ADMIN_KEY=${API_ADMIN_KEY:?Defina API_ADMIN_KEY en .env}"
      - "CORS_ORIGINS=${CORS_ORIGINS:?Defina CORS_ORIGINS con el dominio del frontend}"
    depends_on:
      - qdrant
    networks:
      - backend
      - frontend_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sublitex_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data/images_normalized:/data/images_normalized:ro
    environment:
      - API_URL=http://api:8000
      - "API_CLIENT_KEY=${API_CLIENT_KEY:?Defina API_CLIENT_KEY en .env}"
    depends_on:
      - api
    networks:
      - frontend_net

networks:
  backend:
  frontend_net:
